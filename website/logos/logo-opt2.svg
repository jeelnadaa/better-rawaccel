<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Option 2: Precision Crosshair Curve -->
  <g id="icon" transform="translate(4, 4)">
    <circle cx="20" cy="20" r="18" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.75"/>
    <!-- Crosshairs -->
    <line x1="20" y1="4" x2="20" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="30" x2="20" y2="36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="20" x2="10" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="20" x2="36" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <!-- S-curve through the crosshairs -->
    <path d="M 9 27 C 15 27, 18 20, 24 13 S 31 11, 31 11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="2.5" fill="#e5484d"/>
  </g>
  <text x="56" y="32" font-family="'Satoshi', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="-1px" fill="currentColor">
    accel<tspan fill="#e5484d">.</tspan>
  </text>
</svg>
