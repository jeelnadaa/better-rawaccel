name: Release

# Every push to main builds the app and publishes a release with a ready-to-run zip.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "doc/**"
      - "design/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 2.0.${{ github.run_number }}
      ASSET: BetterRawAccel-win-x64.zip
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build src/BetterRawAccel/BetterRawAccel.csproj -c Release -p:Platform=x64 -p:Version=${{ env.VERSION }}

      - name: Package
        shell: pwsh
        run: |
          $out = "src/BetterRawAccel/bin/x64/Release"
          $stage = "dist/BetterRawAccel"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$out/*" $stage -Recurse
          # Not needed at run time.
          Get-ChildItem $stage -Recurse -Include *.pdb, settings.json, Microsoft.Web.WebView2.Wpf.dll | Remove-Item -Force
          Copy-Item README.md, LICENSE, CHECKLIST.md $stage
          New-Item -ItemType Directory -Force "$stage/doc" | Out-Null
          Copy-Item doc/Guide.md, doc/FAQ.md, doc/MCP.md "$stage/doc"

          # The driver, its installer and the app must all be in the zip, so nobody needs another download.
          foreach ($f in "BetterRawAccel.exe", "wrapper.dll", "installer.exe", "uninstaller.exe", "writer.exe", "driver/rawaccel.sys", "ui/index.html", "ui/fonts/archivo-latin-standard-normal.woff2") {
            if (-not (Test-Path "$stage/$f")) { throw "missing from package: $f" }
          }

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$env:ASSET"
          $hash = (Get-FileHash "dist/$env:ASSET" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET" | Out-File "dist/$env:ASSET.sha256" -Encoding ascii -NoNewline
          "Packaged $env:ASSET ($hash)"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Built from $env:GITHUB_SHA.

          **Install:** download ``$env:ASSET``, unzip it anywhere, and run ``BetterRawAccel.exe``.
          If the Raw Accel driver is not installed yet, the app offers to run the bundled ``installer.exe`` (needs a restart afterwards).

          The zip contains the signed Raw Accel driver unchanged. See CREDITS.md.
          Existing installs update themselves from this release.
          "@
          gh release create "v$env:VERSION" "dist/$env:ASSET" "dist/$env:ASSET.sha256" `
            --title "Better Raw Accel $env:VERSION" `
            --notes $notes `
            --target $env:GITHUB_SHA
