<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Option 1: Kinetic Tangent (Icon + Wordmark) -->
  <g id="icon" transform="translate(4, 4)">
    <rect width="40" height="40" rx="8" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.75"/>
    <!-- Velocity grid lines -->
    <line x1="8" y1="32" x2="32" y2="32" stroke="currentColor" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="8" y1="8" x2="8" y2="32" stroke="currentColor" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Acceleration curve sweeping upward -->
    <path d="M 8 32 C 16 32, 22 26, 28 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tangent arrow / target dot -->
    <circle cx="28" cy="12" r="3.2" fill="currentColor"/>
    <circle cx="28" cy="12" r="6" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6"/>
  </g>
  <text x="56" y="32" font-family="'Satoshi', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="-1px" fill="currentColor">
    accel<tspan fill="#e5484d">.</tspan>
  </text>
</svg>
